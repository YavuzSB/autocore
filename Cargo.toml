[workspace]
resolver = "2"
members = [
    "crates/autocore-base",
    "crates/autocore-safety",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SANCAK Autonomous Systems Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sancak/autocore"

[workspace.dependencies]
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
static_assertions = "1.1"
bytemuck = { version = "1.21", features = ["derive"] }
geo = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
